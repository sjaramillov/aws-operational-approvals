name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check publication contents and provenance
        run: python scripts/check_repository.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sales_demo/web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix sales_demo/web
      - name: Verify domain, contracts, web, HTTP and Lambda packages
        run: make python-check web-check smoke-api packages PYTHON=python
      - name: Check Terraform static policy
        run: python sales_demo/terraform/plan_guard.py --static-only
      - name: Install browser for local UI tests
        working-directory: sales_demo/web
        run: npx playwright install --with-deps chromium
      - name: Test the local browser demonstration
        run: make e2e
