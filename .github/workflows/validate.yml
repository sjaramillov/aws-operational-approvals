name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Check publication contents and provenance
        run: python scripts/check_repository.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sales_demo/web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix sales_demo/web
      - name: Verify domain, contracts, web, HTTP and Lambda packages
        run: make python-check web-check smoke-api packages PYTHON=python
      - name: Check Terraform static policy
        run: python sales_demo/terraform/plan_guard.py --static-only
      - name: Install browser for local UI tests
        working-directory: sales_demo/web
        run: npx playwright install --with-deps chromium
      - name: Test the local browser demonstration
        run: make e2e
