version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"
  - package-ecosystem: "npm"
    directory: "/sales_demo/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/plugin-react"
          - "vitest"
          - "@vitest/*"
  - package-ecosystem: "terraform"
    directory: "/sales_demo/terraform"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
