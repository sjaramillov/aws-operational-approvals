version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/sales_demo/web"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: "terraform"
    directory: "/sales_demo/terraform"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
