<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="es"><title id="diagram-title">Aprobaciones operativas: arquitectura de solución</title><desc id="diagram-desc">Arquitectura actual con interfaz local y API Python separadas, sin conexión entre ambas. Arquitectura AWS candidata no desplegada: CloudFront y S3, Cognito, API Gateway, Lambda API, Step Functions Standard, worker, DynamoDB, KMS y EventBridge Scheduler. Los controles externos requieren completar el bootstrap del cliente.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087F68"/></marker><marker id="arrow-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 0 L0 4.5 L9 9 Z" fill="#087F68"/></marker></defs><rect width="1800" height="1200" fill="#F7F5EF"/><text x="70" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087F68" text-anchor="start">AWS-OPERATIONAL-APPROVALS / ARQUITECTURA DE SOLUCIÓN</text><text x="70" y="121" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#152837" text-anchor="start">Una decisión, un estado y su evidencia</text><text x="70" y="163" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#51636B" text-anchor="start">Lo verificado hoy y la arquitectura candidata para el piloto del cliente.</text><rect x="1465" y="46" width="275" height="44" rx="22" fill="#E8F1EB" stroke="#E8F1EB" stroke-width="1.5"/><text x="1602.5" y="75" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="middle">CORTE · 07-09-2026</text><rect x="60" y="198" width="1680" height="295" rx="16" fill="#FFFEFA" stroke="#CBD8D0" stroke-width="1.5"/><text x="90" y="237" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#152837" text-anchor="start">01  Estado actual: dos recorridos locales</text><text x="1705" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="end">VERIFICADO EN LOCAL</text><rect x="90" y="263" width="790" height="164" rx="12" fill="#E8F1EB" stroke="#E8F1EB" stroke-width="1.5"/><rect x="910" y="263" width="800" height="164" rx="12" fill="#E8F1EB" stroke="#E8F1EB" stroke-width="1.5"/><text x="115" y="292" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#087F68" text-anchor="start">NAVEGADOR · 8 E2E LOCALES</text><text x="935" y="292" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#087F68" text-anchor="start">API PYTHON · 15 COMPROBACIONES HTTP</text><rect x="115" y="313" width="190" height="86" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5"/><text x="133" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Interfaz React</text><text x="133" y="373" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Datos sintéticos</text><rect x="350" y="313" width="220" height="86" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5"/><text x="368" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Adaptador demo</text><text x="368" y="373" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Reglas TypeScript</text><rect x="615" y="313" width="235" height="86" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5"/><text x="633" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">localStorage</text><text x="633" y="373" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Datos del navegador</text><path d="M305 356 H350" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M570 356 H615" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="935" y="313" width="210" height="86" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5"/><text x="953" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">HTTP loopback</text><text x="953" y="373" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Identidad sintética</text><rect x="1185" y="313" width="255" height="86" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5"/><text x="1203" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Dominio + callback</text><text x="1203" y="373" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Servicios Python</text><rect x="1480" y="313" width="205" height="86" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5"/><text x="1498" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Memoria</text><text x="1498" y="373" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Estado del proceso</text><path d="M1145 356 H1185" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1440 356 H1480" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="100" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#152837" text-anchor="start">Sin conexión entre ambas superficies: estas pruebas no acreditan una integración desplegada.</text><rect x="60" y="521" width="1680" height="565" rx="16" fill="#FFFEFA" stroke="#CBD8D0" stroke-width="1.5"/><text x="90" y="564" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#152837" text-anchor="start">02  Objetivo AWS: código e IaC candidatos</text><text x="1705" y="564" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#866127" text-anchor="end">NO DESPLEGADO</text><rect x="100" y="604" width="715" height="68" rx="12" fill="#E8F1EB" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="120" y="633" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">CloudFront → S3 privado</text><text x="120" y="659" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Entrega de la PWA · acceso al origen mediante OAC</text><rect x="860" y="604" width="815" height="68" rx="12" fill="#E8F1EB" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="880" y="633" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Cognito · Authorization Code + PKCE</text><text x="880" y="659" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Cliente público sin secret · sin autorregistro</text><path d="M205 672 V715" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M280 715 V690 H1120 V672" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6" marker-start="url(#arrow-start)"/><text x="515" y="709" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#087F68" text-anchor="start">inicio de sesión</text><path d="M330 761 H395" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="359" y="746" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#087F68" text-anchor="middle">JWT</text><path d="M625 761 H690" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><path d="M950 761 H1020" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="985" y="746" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#087F68" text-anchor="middle">iniciar</text><path d="M1290 761 H1405" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1347" y="746" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#087F68" text-anchor="middle">invocar</text><path d="M1535 715 V693 H1175 V715" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1358" y="712" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#087F68" text-anchor="middle">callback</text><path d="M820 807 V900" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="837" y="850" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#087F68" text-anchor="start">leer / transacción</text><path d="M1445 807 V878 H910 V900" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1120" y="869" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#087F68" text-anchor="start">estado y auditoría</text><path d="M1555 807 V900" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1570" y="850" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#087F68" text-anchor="start">cifrar token</text><path d="M938 807 V838 H1420 V807" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="1120" y="829" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#087F68" text-anchor="start">decisión humana</text><path d="M1290 944 H1340 V1000 H1710 V789 H1675" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><rect x="100" y="715" width="230" height="92" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="118" y="747" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Navegador</text><text x="118" y="775" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Solicitante · aprobador</text><rect x="395" y="715" width="230" height="92" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="413" y="747" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">API Gateway</text><text x="413" y="775" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">HTTP API · JWT</text><rect x="690" y="715" width="260" height="92" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="708" y="747" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Lambda API</text><text x="708" y="775" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Tenant · idempotencia</text><rect x="1020" y="715" width="270" height="92" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1038" y="747" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Step Functions</text><text x="1038" y="775" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Standard · decisión</text><rect x="1405" y="715" width="270" height="92" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1423" y="747" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">Lambda worker</text><text x="1423" y="775" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Callback · finalización</text><rect x="690" y="900" width="260" height="88" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="708" y="932" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">DynamoDB</text><text x="708" y="960" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Auditoría · PK/SK tenant</text><rect x="1020" y="900" width="270" height="88" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1038" y="932" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">EventBridge</text><text x="1038" y="960" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Scheduler · expiración</text><rect x="1405" y="900" width="270" height="88" rx="16" fill="#FFFEFA" stroke="#087F68" stroke-width="1.5" stroke-dasharray="7 5"/><text x="1423" y="932" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#152837" text-anchor="start">KMS</text><text x="1423" y="960" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Cifrado con contexto</text><rect x="100" y="908" width="530" height="72" rx="12" fill="#E8F1EB" stroke="#E8F1EB" stroke-width="1.5"/><text x="119" y="936" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#152837" text-anchor="start">Regla del ejemplo: ≤50 automático;</text><text x="119" y="964" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#51636B" text-anchor="start">&gt;50 requiere decisión humana durable.</text><text x="101" y="1023" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Roles IAM: API · worker · workflow · scheduler. Logs CloudWatch: 14 días, sin datos de ejecución del workflow.</text><text x="101" y="1056" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#152837" text-anchor="start">Boundary, CMK, Budget y state externos: bootstrap independiente pendiente antes del piloto AWS.</text><path d="M75 1130 H133" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="150" y="1137" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Flujo local comprobado</text><path d="M575 1130 H633" fill="none" stroke="#087F68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="8 6"/><text x="650" y="1137" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#51636B" text-anchor="start">Relación candidata en IaC</text><text x="1200" y="1137" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#152837" text-anchor="start">Datos sintéticos · sin runtime AWS acreditado</text><text x="75" y="1176" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#51636B" text-anchor="start">Fuentes: código y evidencia local; documentación AWS Step Functions / HTTP API. Consulta: 07-09-2026. Referencias en diagram-notes.md.</text></svg>