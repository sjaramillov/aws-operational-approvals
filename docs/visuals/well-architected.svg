<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="es"><title id="diagram-title">Aprobaciones operativas: matriz de revisión AWS Well-Architected</title><desc id="diagram-desc">Matriz propia de revisión de los seis pilares: Excelencia operativa, Seguridad, Fiabilidad, Eficiencia del rendimiento, Optimización de costos y Sostenibilidad. Cada pilar muestra decisiones o evidencia local y un pendiente verificable. No es una evaluación oficial, puntuación o certificación de AWS.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#087F68"/></marker><marker id="arrow-start" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M9 0 L0 4.5 L9 9 Z" fill="#087F68"/></marker></defs><rect width="1800" height="1200" fill="#F7F5EF"/><text x="70" y="62" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087F68" text-anchor="start">AWS-OPERATIONAL-APPROVALS / REVISIÓN DE ARQUITECTURA</text><text x="70" y="120" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#152837" text-anchor="start">AWS Well-Architected</text><text x="70" y="165" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#51636B" text-anchor="start">Seis pilares para convertir el candidato local en un piloto verificable.</text><rect x="1360" y="46" width="380" height="44" rx="22" fill="#E8F1EB" stroke="#E8F1EB" stroke-width="1.5"/><text x="1550" y="75" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="middle">MATRIZ PROPIA · 07-09-2026</text><rect x="60" y="206" width="1680" height="818" rx="16" fill="#FFFEFA" stroke="#CBD8D0" stroke-width="1.5"/><rect x="61" y="207" width="1678" height="61" rx="15" fill="#E8F1EB" stroke="#E8F1EB" stroke-width="1.5"/><text x="92" y="247" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">PILAR</text><text x="474" y="247" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">DECISIÓN Y EVIDENCIA DE ESTA VERSIÓN</text><text x="1125" y="247" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">PENDIENTE VERIFICABLE</text><text x="92" y="310" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">OPS</text><text x="172" y="318" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">Excelencia</text><text x="172" y="350" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">operativa</text><text x="474" y="298" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087F68" text-anchor="start">LOCAL · REPRODUCIBLE</text><text x="474" y="334" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Pruebas y runbook; ZIP deterministas.</text><text x="474" y="364" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">146 tests Python + 8 E2E locales.</text><text x="1125" y="298" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#866127" text-anchor="start">COMPROBAR EN EL PILOTO</text><text x="1125" y="334" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Acordar SLO, alarmas y responsables;</text><text x="1125" y="364" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">ensayar el cierre en el entorno cliente.</text><rect x="61" y="394" width="1678" height="126" rx="0" fill="#F1F4EE" stroke="#F1F4EE" stroke-width="1.5"/><path d="M61 394 H1739" stroke="#CBD8D0" stroke-width="1"/><text x="92" y="436" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">SEC</text><text x="172" y="444" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">Seguridad</text><text x="474" y="424" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087F68" text-anchor="start">LOCAL + IaC</text><text x="474" y="460" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Tenant desde identidad; pruebas de 404.</text><text x="474" y="490" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">PKCE, JWT, OAC y KMS en el candidato.</text><text x="1125" y="424" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#866127" text-anchor="start">COMPROBAR EN EL PILOTO</text><text x="1125" y="460" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Validar IAM/Cognito extremo a extremo;</text><text x="1125" y="490" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">revisar las 40 exclusiones Checkov.</text><path d="M61 520 H1739" stroke="#CBD8D0" stroke-width="1"/><text x="92" y="562" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">REL</text><text x="172" y="570" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">Fiabilidad</text><text x="474" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087F68" text-anchor="start">LOCAL + IaC</text><text x="474" y="586" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Idempotencia y callback recuperable;</text><text x="474" y="616" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">decisión 202 seguida de lectura durable.</text><text x="1125" y="550" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#866127" text-anchor="start">COMPROBAR EN EL PILOTO</text><text x="1125" y="586" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Probar recuperación en AWS y acordar</text><text x="1125" y="616" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">RTO/RPO; PITR está deshabilitado.</text><rect x="61" y="646" width="1678" height="126" rx="0" fill="#F1F4EE" stroke="#F1F4EE" stroke-width="1.5"/><path d="M61 646 H1739" stroke="#CBD8D0" stroke-width="1"/><text x="92" y="688" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">PERF</text><text x="172" y="696" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">Eficiencia del</text><text x="172" y="728" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">rendimiento</text><text x="474" y="676" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087F68" text-anchor="start">IaC · SIN CARGA MEDIDA</text><text x="474" y="712" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Lambda de 256 MB; DynamoDB 5/5.</text><text x="474" y="742" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Capacidad inicial fijada en el candidato.</text><text x="1125" y="676" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#866127" text-anchor="start">COMPROBAR EN EL PILOTO</text><text x="1125" y="712" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Medir latencia p95, carga y throttling;</text><text x="1125" y="742" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">ajustar memoria y capacidad con datos.</text><path d="M61 772 H1739" stroke="#CBD8D0" stroke-width="1"/><text x="92" y="814" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">COST</text><text x="172" y="822" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">Optimización</text><text x="172" y="854" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">de costos</text><text x="474" y="802" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087F68" text-anchor="start">LOCAL + IaC</text><text x="474" y="838" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Cuota de 10 solicitudes/tenant/día;</text><text x="474" y="868" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">expiración de 192 h en el diseño.</text><text x="1125" y="802" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#866127" text-anchor="start">COMPROBAR EN EL PILOTO</text><text x="1125" y="838" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Medir costo por decisión y transferencia;</text><text x="1125" y="868" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Budget es alerta, no tope de gasto.</text><rect x="61" y="898" width="1678" height="126" rx="0" fill="#F1F4EE" stroke="#F1F4EE" stroke-width="1.5"/><path d="M61 898 H1739" stroke="#CBD8D0" stroke-width="1"/><text x="92" y="940" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#087F68" text-anchor="start">SUS</text><text x="172" y="948" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#152837" text-anchor="start">Sostenibilidad</text><text x="474" y="928" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087F68" text-anchor="start">IaC · HIPÓTESIS SIN MEDIR</text><text x="474" y="964" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Servicios administrados y cierre efímero;</text><text x="474" y="994" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">logs limitados a 14 días en el candidato.</text><text x="1125" y="928" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#866127" text-anchor="start">COMPROBAR EN EL PILOTO</text><text x="1125" y="964" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">Medir recursos por solicitud y retención;</text><text x="1125" y="994" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#152837" text-anchor="start">sin medición ambiental del producto.</text><path d="M445 206 V1024 M1095 206 V1024" stroke="#CBD8D0" stroke-width="1"/><text x="75" y="1064" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#51636B" text-anchor="start">LOCAL = comportamiento probado aquí.  IaC = configuración candidata, sin validación runtime en AWS.</text><rect x="70" y="1084" width="1660" height="48" rx="12" fill="#E8F1EB" stroke="#E8F1EB" stroke-width="1.5"/><text x="900" y="1115" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#152837" text-anchor="middle">Matriz de revisión, no evaluación oficial: sin puntuación, certificación ni beneficios medidos.</text><text x="75" y="1160" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#51636B" text-anchor="start">Fuentes: AWS Well-Architected Framework, sus seis pilares y SUS05-BP03; evidencia y código del producto.</text><text x="75" y="1184" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#51636B" text-anchor="start">Consultadas: 07-09-2026 · Nombres según documentación oficial en español · Referencias y límites en diagram-notes.md.</text></svg>